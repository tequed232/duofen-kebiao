name: Auto review

# 「审 PR / 审 Issue 的自动化账号」。
#
# 为什么不用自己注册一个账号：用一个脚本去注册 GitHub 账号、再拿它跑自动化，
# 违反 GitHub 的《Acceptable Use Policies》（禁止批量注册与把账号当机器人使用），
# 账号可能被封，且与本人账号关联有连带风险。
#
# 官方做法就是用 Actions 自带的 GITHUB_TOKEN —— 它以 `github-actions[bot]` 身份提交 review，
# 不需要额外账号、不需要存密钥、权限被限制在本仓库内，而且每次运行都留下可审计的记录。
#
# 它解决的正是作者遇到的死结：GitHub 不允许批准自己创建的 PR
# （`422 Review Can not approve your own pull request`）—— 但 bot 与作者不是同一个身份，
# 所以 `github-actions[bot]` 可以批准作者开的 PR。
#
# 前置开关（一次性，仓库所有者操作）：
#   Settings → Actions → General → Workflow permissions
#   → 勾选 “Allow GitHub Actions to create and approve pull requests”
# 不勾选时 GITHUB_TOKEN 只能 COMMENT，APPROVE 会被拒：
#   `422 GitHub Actions is not permitted to approve pull requests.`
# 该步骤对这种情形做了降级处理（见文件末尾），所以漏勾也只会少一个批准，
# 不会让整个 workflow 变红、更不会让 PR 拿不到 review。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # PR：跑完守卫后给出 review。
  # 默认只 COMMENT（写明它检查了什么、哪些没过），**全部条件满足才 APPROVE**：
  #   1. 提交者是仓库所有者 —— 别人的 PR 由人来审，机器不替人做判断
  #   2. 目标分支是 main
  #   3. 不是草稿
  #   4. 没打 block-autoreview 标签（需要人工细看时用它拦下）
  #   5. 本仓库自己的守卫（hygiene / secret 扫描 / 前端安全 / 版本号 / ISBN）全部通过
  # 这样它挡的是「自己 PR 没人能批」这个形式问题，而不是替代真实评审。
  # ------------------------------------------------------------------
  review-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 守卫分两类，环境要求不同（第一次运行时踩过：没装依赖 / 没起服务，
      # 于是 isbn 与 schedule-html 在 CI 里从来跑不起来，报的是「环境没准备好」而不是代码问题）。
      - name: 安装依赖
        run: npm ci

      - name: 装 Playwright 浏览器（schedule-html 守卫要用）
        run: npx playwright install --with-deps chromium

      # 守卫逐个跑并记录结果。用 `|| true` 收住退出码：这里要的是「报告结果」，
      # 而不是让本 job 变红 —— job 变红留给专用 workflow（hygiene / secret-scan / android）。
      - name: 运行仓库自带守卫
        id: guards
        run: |
          set -uo pipefail
          mkdir -p /tmp/guard-report
          overall=ok
          run_guard () {
            local name="$1"; shift
            if "$@" > /tmp/guard-report/"$name".log 2>&1; then
              echo "PASS $name" >> /tmp/guard-report/summary.txt
            else
              echo "FAIL $name" >> /tmp/guard-report/summary.txt
              overall=fail
            fi
          }

          # ① 纯 Node 脚本，不需要额外环境
          run_guard hygiene        node scripts/check-repo-hygiene.mjs
          run_guard secrets        node scripts/check-secrets.mjs
          run_guard web-security   node scripts/check-web-security.mjs
          run_guard version        node scripts/check-version.mjs
          # 开源署名清单是否跟得上依赖（本地识别引入 opencv-js / tesseract.js 时曾漏掉署名）
          run_guard licenses       node scripts/collect-licenses.mjs --check
          # ② 需要 esbuild（依赖已 npm ci）
          run_guard isbn           node scripts/check-isbn.mjs
          # ③ 需要 Playwright 的 chromium（上一节已装）：量引擎对 backdrop-filter 的真实行为，
          #    不依赖任何服务，跑在 dev server 之前
          run_guard backdrop-refraction node scripts/check-backdrop-refraction.mjs
          # ④ 需要 dev server（它从源码 import TS，解析依赖 DOMParser）
          npm run dev -- --port 5173 --strictPort > /tmp/guard-report/dev.log 2>&1 &
          dev_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          APP_URL=http://127.0.0.1:5173/ run_guard schedule-html node scripts/check-schedule-html.mjs
          # 真实导入界面端到端：把「模型回复」整段粘进去，看课表是否真进来
          # （schedule-html 只验解析器；这条验的是导入教程教用户走的那条路真的通）
          APP_URL=http://127.0.0.1:5173/ run_guard import-e2e  node scripts/check-import-e2e.mjs
          kill "$dev_pid" 2>/dev/null || true

          # ⑤ 逐屏验收（19 步）：需要**生产构建 + preview server**。
          #    它写于 v2 前，一度 19 步里 11 步失败；而因为不在 CI 里跑，烂了很久没人发现。
          #    接进来就是为了让它不能再悄悄烂掉 —— 状态与三处静默失效见文件头注释。
          npm run build > /tmp/guard-report/build.log 2>&1
          npm run preview > /tmp/guard-report/preview.log 2>&1 &
          preview_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          run_guard verify         node scripts/verify.mjs
          kill "$preview_pid" 2>/dev/null || true

          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          cat /tmp/guard-report/summary.txt

      - name: 上传守卫日志（失败时用于定位）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-logs
          path: /tmp/guard-report/
          retention-days: 7

      - name: 组装 review 正文
        id: body
        run: |
          set -uo pipefail
          {
            echo "## 自动检查（github-actions[bot]）"
            echo
            echo "对提交 \`${{ github.event.pull_request.head.sha }}\` 跑了仓库自带的守卫："
            echo
            echo '| 守卫 | 结果 |'
            echo '| --- | --- |'
            while read -r line; do
              status="${line%% *}"; name="${line##* }"
              if [ "$status" = "PASS" ]; then echo "| \`$name\` | ✅ |"; else echo "| \`$name\` | ❌ |"; fi
            done < /tmp/guard-report/summary.txt
            echo
            echo "失败项的日志见本次运行的 artifacts / 下方 job 输出。"
            echo
            echo "> 本 review 由 \`.github/workflows/auto-review.yml\` 自动提交。"
            echo "> 它只代表**这些机器可判定的检查**通过了，不构成对设计取舍的评审 ——"
            echo "> 那部分仍需人工判断（或顾问）。"
          } > /tmp/review-body.md
          cat /tmp/review-body.md

      # 用 gh 提交 review：GITHUB_TOKEN 以 github-actions[bot] 身份出现。
      # 关键点：先按结论提交；若 APPROVE 被仓库设置拒绝，就降级成 COMMENT 重提，
      # 而不是让 step 以 exit 1 收场 —— 那样 PR 会既没批准、也没留下 review 正文。
      - name: 提交 review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GUARDS: ${{ steps.guards.outputs.overall }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          event=COMMENT
          reason=""

          if [ "$GUARDS" != "ok" ]; then
            reason="守卫未全部通过（见 review 正文）"
          elif [ "$AUTHOR" != "$OWNER" ]; then
            reason="提交者 @$AUTHOR 不是仓库所有者，留给人工评审"
          elif [ "$BASE" != "main" ]; then
            reason="目标分支是 $BASE，不是 main"
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="PR 仍是草稿"
          elif echo ",$LABELS," | grep -q ',block-autoreview,'; then
            reason="带了 block-autoreview 标签，需人工细看"
          else
            event=APPROVE
            reason="机器可判定的检查全部通过"
          fi

          # 结论行单独放一个文件：降级重提时只换它，正文表格不用重建。
          make_footer () {
            {
              echo ""
              echo "**结论：$1** —— $2"
            } > /tmp/review-footer.md
          }

          submit () {
            cat /tmp/review-body.md /tmp/review-footer.md > /tmp/review-final.md
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              -f event="$1" \
              -F body=@/tmp/review-final.md \
              --jq '"review: \(.state) by \(.user.login)"' 2>/tmp/review-err.txt
          }

          make_footer "$event" "$reason"
          if submit "$event"; then
            exit 0
          fi

          echo "::warning::以 $event 提交 review 失败：$(cat /tmp/review-err.txt)"

          # 唯一已知的可降级故障：仓库没开 “Allow GitHub Actions to create and approve pull requests”。
          # 这时 APPROVE 会被 422 拒绝，但 COMMENT 仍然可用。
          if [ "$event" = "APPROVE" ]; then
            echo "::notice::仓库未允许 Actions 审批 PR，本次 review 降级为 COMMENT。"
            echo "::notice::开启方式：Settings → Actions → General → Workflow permissions，勾选 “Allow GitHub Actions to create and approve pull requests”。"
            event=COMMENT
            reason="机器可判定的检查全部通过；本应 APPROVE，但仓库未允许 Actions 审批 PR，降级为 COMMENT"
            make_footer "$event" "$reason"
            if submit "$event"; then
              exit 0
            fi
          fi

          cat /tmp/review-err.txt
          exit 1
