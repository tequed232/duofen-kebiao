name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 必须先有网页产物与识别资源，否则 gradle 的 checkWebSources 会直接拦下 ——
      # 这正是我们要的行为：以前这里只跑 `gradlew assembleRelease`，
      # 两个 sync 任务因源缺失被判成 NO-SOURCE 整体跳过（写在 doFirst 里的 require 也就永不执行），
      # 于是**一路绿灯地打出 assets/www 为空的空壳 APK**，还当成品上传。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web (→ dist/)
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache

      # 证明这份 APK 里的网页资源与 dist/ **逐文件哈希一致**。
      # 它需要已构建的 APK，所以只在这里跑得了（auto-review 那个 job 只做 dev server 与浏览器检查）。
      - name: Verify APK matches the web build
        run: npm run apk:parity

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: duofen-kebiao-arm64-release
          path: app/build/outputs/apk/release/*.apk
