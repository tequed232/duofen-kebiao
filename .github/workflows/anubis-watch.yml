name: Anubis watch

# 持续监控上游 Anubis 项目（TecharoHQ/anubis）：
#  1) 每天检查最新 release / tag，与 deploy/anubis/VERSION 比对，有新版本就开 issue（不重复开）；
#  2) 校验本地 botPolicies.yaml 能被解析且包含必要字段；
#  3) 如果配置了 ANUBIS_BASE_URL secret，则对该实例做一次健康探活。

on:
  schedule:
    - cron: '17 3 * * *' # 每天 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'deploy/anubis/**'
      - '.github/workflows/anubis-watch.yml'

permissions:
  contents: read
  issues: write

jobs:
  upstream-release:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.compare.outputs.latest }}
      pinned: ${{ steps.compare.outputs.pinned }}
      outdated: ${{ steps.compare.outputs.outdated }}
    steps:
      - uses: actions/checkout@v4

      # fork 默认关闭 Issues；这里开 issue 会直接让 `gh` 报错退出，先探测能力。
      - name: Check whether issues are available
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          if [ "$has_issues" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "本仓库未开启 Issues，跳过版本跟踪 issue。"
          fi

      - name: Read pinned version
        id: pinned
        run: echo "value=$(tr -d '[:space:]' < deploy/anubis/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/TecharoHQ/anubis/releases/latest --jq '.tag_name')
          published=$(gh api repos/TecharoHQ/anubis/releases/latest --jq '.published_at')
          notes=$(gh api repos/TecharoHQ/anubis/releases/latest --jq '.body' | head -c 2000)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<ANUBIS_NOTES_EOF"
            echo "$notes"
            echo "ANUBIS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with the pinned version
        id: compare
        run: |
          pinned='${{ steps.pinned.outputs.value }}'
          latest='${{ steps.upstream.outputs.latest }}'
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            echo "已是最新：$pinned"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "有新版本：$pinned -> $latest"
          fi

      - name: Open or update the tracking issue
        if: steps.compare.outputs.outdated == 'true' && steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          PINNED: ${{ steps.pinned.outputs.value }}
          PUBLISHED: ${{ steps.upstream.outputs.published }}
          NOTES: ${{ steps.upstream.outputs.notes }}
        run: |
          title="Anubis 上游有新版本：${LATEST}（当前锁定 ${PINNED}）"
          body=$(cat <<EOF
          ## Anubis 有新版本

          - 上游最新：\`${LATEST}\`（发布于 ${PUBLISHED}）
          - 本仓库锁定：\`${PINNED}\`（见 \`deploy/anubis/VERSION\`）
          - 上游 release：https://github.com/TecharoHQ/anubis/releases/tag/${LATEST}

          ### 升级清单
          - [ ] 阅读上游 release notes / 迁移说明
          - [ ] 更新 \`deploy/anubis/VERSION\` 与 \`docker-compose.yml\` 的镜像 tag
          - [ ] 如有配置变更，同步 \`deploy/anubis/botPolicies.yaml\`（上游 docs/docs/admin/configuration/）
          - [ ] 在服务器上 \`docker compose pull && docker compose up -d\`，观察 \`docker compose logs -f anubis\`
          - [ ] 检查 \`/metrics\`：挑战率、拒绝数是否异常

          <details><summary>上游 release notes（节选）</summary>

          \`\`\`
          ${NOTES}
          \`\`\`

          </details>
          EOF
          )
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "已追加评论到 issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label "dependencies" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Summary
        run: |
          {
            echo "### Anubis 版本检查"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 本仓库锁定 | \`${{ steps.pinned.outputs.value }}\` |"
            echo "| 上游最新 | \`${{ steps.upstream.outputs.latest }}\` |"
            echo "| 需要升级 | ${{ steps.compare.outputs.outdated }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-policy:
    name: Validate botPolicies.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the policy file
        run: |
          python3 - <<'PY'
          import sys, yaml

          path = "deploy/anubis/botPolicies.yaml"
          with open(path, encoding="utf-8") as handle:
              policy = yaml.safe_load(handle)

          assert isinstance(policy, dict), "botPolicies.yaml 必须是映射"
          bots = policy.get("bots")
          thresholds = policy.get("thresholds")
          assert isinstance(bots, list) and bots, "必须定义 bots 列表"
          assert isinstance(thresholds, list) and thresholds, "必须定义 thresholds 列表"

          allowed_actions = {"ALLOW", "DENY", "CHALLENGE", "WEIGH"}
          for bot in bots:
              action = bot.get("action")
              assert action in allowed_actions, f"{bot.get('name')} 的 action 非法：{action}"
              if action == "WEIGH":
                  assert isinstance(bot.get("weight", {}).get("adjust"), int), f"{bot.get('name')} 缺少 weight.adjust"
          for rule in thresholds:
              assert rule.get("action") in allowed_actions, f"threshold {rule.get('name')} 的 action 非法"
              if rule.get("action") == "CHALLENGE":
                  challenge = rule.get("challenge", {})
                  assert challenge.get("algorithm"), f"{rule.get('name')} 缺少 challenge.algorithm"

          print(f"OK: {len(bots)} 条 bot 规则，{len(thresholds)} 条阈值规则")
          PY

  healthcheck:
    name: Health check the deployment
    runs-on: ubuntu-latest
    # 只有配置了 secret 才探活，避免 fork / 未部署时报错
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Probe the Anubis-protected site
        env:
          ANUBIS_BASE_URL: ${{ secrets.ANUBIS_BASE_URL }}
        run: |
          if [ -z "${ANUBIS_BASE_URL}" ]; then
            echo "未配置 ANUBIS_BASE_URL，跳过探活（在仓库 secrets 里加上即可启用）"
            exit 0
          fi
          set -euo pipefail
          status=$(curl -s -o /tmp/body -w '%{http_code}' -m 20 "${ANUBIS_BASE_URL}/")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::站点返回 $status，请检查 Anubis / Caddy 状态"
          fi
          if grep -qi 'within.website\|anubis' /tmp/body; then
            echo "检测到 Anubis 挑战页或标识，防火墙在线 ✅"
          else
            echo "::warning::没有看到 Anubis 的挑战页标识，请确认流量确实经过 Anubis"
          fi
