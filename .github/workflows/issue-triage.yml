name: Issue triage

# 新 issue 的首次响应：给提交者一份「怎么把问题说清楚」的清单，
# 并按标题关键词自动打标签，减少来回追问。
#
# 单独一个文件（不并进 auto-review.yml）：一开始把 pull_request 与 issues 写在同一个
# workflow 里，结果 GitHub 没为它注册 pull_request 触发器 —— 同分支其它 workflow 都被
# synchronize 触发了，只有它没有。拆开之后各管各的，触发也正常。
#
# 用 GitHub 官方 actions/github-script 与 Actions 自带的 GITHUB_TOKEN，
# 不需要额外账号、不需要存密钥。

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  greet:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: 首次响应 issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            // 刚打开时评论数为 0；重新打开时若已有人回过就不再打扰
            if (issue.comments > 0 && context.payload.action !== 'reopened') return;

            const body = [
              '谢谢你提出来 👋 为了能尽快定位，麻烦补一下这几项（有就填，没有可跳过）：',
              '',
              '- **复现步骤**：点了哪里、期望什么、实际什么',
              '- **环境**：手机型号 / 系统版本（流体云相关请注明 ColorOS 版本）、用的是网页版还是 APK',
              '- **截图或录屏**：界面问题最好有图',
              '- 如果是**课表导入**问题：贴一小段导入源（HTML / 文本），或说明是从哪个教务系统导出的',
              '',
              '> 这条是自动回复（`github-actions[bot]`）。维护者看到后会跟进。',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            // 按标题关键词打标签（标签不存在时静默跳过，不因此报错）
            const title = issue.title || '';
            const want = [];
            if (/bug|错误|失败|崩溃|闪退|异常|不能|无法/i.test(title)) want.push('bug');
            if (/希望|建议|能否|可不可以|feature|支持/i.test(title)) want.push('enhancement');
            if (want.length) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: want,
                });
              } catch (error) {
                core.info(`打标签跳过：${error.message}`);
              }
            }
