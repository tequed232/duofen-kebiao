name: Secret scan

# 防止密钥被提交进（公开的）仓库：每次推送与每天定时扫描，
# 命中真实密钥特征就失败，并提醒去轮换密钥 + 重写历史。

on:
  push:
  schedule:
    - cron: '0 22 * * *' # 每天 22:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来扫描旧提交

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the repository secret audit
        run: node scripts/check-secrets.mjs

      - name: Fail when a real credential pattern shows up
        run: |
          # check-secrets.mjs 会对「精确密钥特征」汇总；命中即失败（误报由脚本内置白名单处理）
          output=$(node scripts/check-secrets.mjs)
          echo "$output"
          if echo "$output" | grep -qE 'sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "::error::检测到疑似真实密钥，请立即轮换并清理历史"
            exit 1
          fi
