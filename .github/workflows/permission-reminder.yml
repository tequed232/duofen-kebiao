name: Asset permission reminder

# 「素材授权台账」提醒器。
#
# 说明：GitHub 无法读取任何人的邮箱或 B 站私信（那需要登录态），所以这里监控的是
# **仓库里的台账状态**：只要 docs/asset-permissions.md 里还是「待作者回复」，
# 每周就自动开一个提醒 issue，避免忘了跟进；状态改成 approved / declined 后自动停止，
# 并在状态变化时发一条总结评论。

on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'docs/asset-permissions.md'

permissions:
  contents: read
  issues: write

jobs:
  remind:
    name: Check the asset permission ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the ledger status
        id: ledger
        run: |
          file=docs/asset-permissions.md
          if grep -q 'approved' "$file"; then
            echo "status=approved" >> "$GITHUB_OUTPUT"
          elif grep -q 'declined' "$file"; then
            echo "status=declined" >> "$GITHUB_OUTPUT"
          else
            echo "status=pending" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the reminder issue
        if: steps.ledger.outputs.status == 'pending'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="待办：素材授权仍在等待作者回复"
          body=$(cat <<'EOF'
          `docs/asset-permissions.md` 里的状态仍是 **pending**。

          下一步（都需要你本人操作，GitHub 读不到你的邮箱与 B 站私信）：

          1. 打开 <https://message.bilibili.com/#/whisper> 给 **miratsu** 发私信 —
             正文可直接复制台账里的「私信模板」。
          2. 收到回复后，把**原文**粘贴回台账的「作者回复原文」一行。
          3. 把「状态」改成 `approved` 或 `declined`（改完这个 issue 就会自动停更）。

          > 提醒频率：每周一；可在 Actions 页面手动触发。状态一旦不再是 pending，本 workflow 不再开新 issue。
          EOF
          )
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "本周复查：状态仍为 pending（$(date -u +%Y-%m-%d)）。"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Report a state change
        if: steps.ledger.outputs.status != 'pending'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.ledger.outputs.status }}
        run: |
          echo "台账状态为 $STATUS，无需提醒。"
          existing=$(gh issue list --search "素材授权仍在等待作者回复 in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "台账状态已更新为 **$STATUS**，提醒到此结束。"
          fi
